spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:20}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:5}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
        show_sql: false
        use_sql_comments: false
        generate_statistics: false

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    connect-retries: 5
    connect-retries-interval: 5

  sql:
    init:
      mode: never

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Request-Id}
    exposed-headers: ${CORS_EXPOSED_HEADERS:X-Request-Id}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

  security:
    secure-cookies: ${SECURE_COOKIES:true}
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:medcore-hms}
      access-expiration: ${JWT_ACCESS_EXPIRATION:PT15M}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}

  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.medcore.hms: ${LOG_LEVEL_APPLICATION:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:WARN}