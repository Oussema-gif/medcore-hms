spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:8}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

graceful-shutdown:
  enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.medcore.hms: ${LOG_LEVEL_APP:INFO}
