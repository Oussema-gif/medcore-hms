spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DEV_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/medcore_hms}}
    username: ${DEV_DATABASE_USERNAME:${DATABASE_USERNAME:medcore}}
    password: ${DEV_DATABASE_PASSWORD:${DATABASE_PASSWORD:medcore}}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: ${DEV_HIBERNATE_FORMAT_SQL:false}
        show_sql: ${DEV_HIBERNATE_SHOW_SQL:false}
        use_sql_comments: false
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${DEV_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: ${DEV_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${DEV_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,X-Request-Id}
    exposed-headers: ${DEV_CORS_EXPOSED_HEADERS:X-Request-Id}
    allow-credentials: ${DEV_CORS_ALLOW_CREDENTIALS:false}
    max-age-seconds: ${DEV_CORS_MAX_AGE_SECONDS:3600}

  security:
    secure-cookies: ${DEV_SECURE_COOKIES:false}
    jwt:
      secret: ${DEV_JWT_SECRET:${JWT_SECRET}}
      issuer: ${DEV_JWT_ISSUER:${JWT_ISSUER:medcore-hms-dev}}
      access-expiration: ${DEV_JWT_ACCESS_EXPIRATION:${JWT_ACCESS_EXPIRATION:PT15M}}
      refresh-expiration: ${DEV_JWT_REFRESH_EXPIRATION:${JWT_REFRESH_EXPIRATION:P30D}}

  bootstrap:
    admin:
      enabled: ${DEV_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${DEV_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${DEV_BOOTSTRAP_ADMIN_EMAIL:}
      display-name: ${DEV_BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password: ${DEV_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    com.medcore.hms: ${DEV_LOG_LEVEL_APPLICATION:DEBUG}
    org.springframework.security: ${DEV_LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${DEV_LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${DEV_LOG_LEVEL_HIBERNATE_BIND:WARN}
    org.flywaydb: ${DEV_LOG_LEVEL_FLYWAY:INFO}